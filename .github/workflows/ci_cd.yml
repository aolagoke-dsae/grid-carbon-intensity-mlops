name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package & dev tools
        run: pip install -e .
      - name: Run linter & unit tests (Gates G1-G3)
        run: |
          ruff check src tests notebooks
          pytest -v
      - name: Setup Databricks CLI & validate Asset Bundle
        uses: databricks/setup-cli@main
      - name: Validate Databricks Asset Bundle
        run: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST: https://databricks.com
          DATABRICKS_TOKEN: dummy-ci-token