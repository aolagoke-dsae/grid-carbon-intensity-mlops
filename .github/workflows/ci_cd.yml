name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package & dev tools
        run: pip install -e ".[dev]"
      - name: Run linter & unit tests (Gates G1-G3)
        run: make test
      # Bundle validation calls the workspace API, so it only runs when the
      # DATABRICKS_HOST / DATABRICKS_TOKEN repository secrets are configured.
      - name: Setup Databricks CLI
        if: env.DATABRICKS_HOST != ''
        uses: databricks/setup-cli@main
      - name: Validate Databricks Asset Bundle
        if: env.DATABRICKS_HOST != ''
        run: databricks bundle validate -t dev
