# Databricks Asset Bundle for Serverless compute (Free Edition has no job clusters).
#
# Every task is a python_wheel_task that runs an entry point from pyproject.toml
# [project.scripts]. The wheel is built by the `artifacts` block and attached to each job
# through a serverless `environments` entry, together with databricks-feature-engineering,
# which serverless does not preinstall.
#
# Catalog and schema come from CarbonMLOpsConfig (workspace.carbon_mlops), not from bundle
# variables, so the code and the bundle cannot disagree.
bundle:
  name: grid-carbon-intensity-mlops

artifacts:
  default:
    type: whl
    path: .
    build: python -m pip wheel . --no-deps --wheel-dir dist

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production

resources:
  jobs:
    carbon_training_pipeline:
      name: "[${bundle.target}] carbon-training-pipeline"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ./dist/*.whl
              - databricks-feature-engineering
      tasks:
        - task_key: ingest_bronze
          environment_key: default
          python_wheel_task:
            package_name: grid_carbon_intensity_mlops
            entry_point: carbon-ingest
        - task_key: materialize_uc_features
          depends_on:
            - task_key: ingest_bronze
          environment_key: default
          python_wheel_task:
            package_name: grid_carbon_intensity_mlops
            entry_point: carbon-features
        - task_key: train_challenger
          depends_on:
            - task_key: materialize_uc_features
          environment_key: default
          python_wheel_task:
            package_name: grid_carbon_intensity_mlops
            entry_point: carbon-train
        - task_key: promotion_gate
          depends_on:
            - task_key: train_challenger
          environment_key: default
          python_wheel_task:
            package_name: grid_carbon_intensity_mlops
            entry_point: carbon-gate

    carbon_batch_inference:
      name: "[${bundle.target}] carbon-batch-inference"
      # Paused: the Bronze snapshot is static, so a schedule would rescore the same hours.
      # Weekly matches the recalibration step the evaluation assumes.
      schedule:
        quartz_cron_expression: "0 15 6 ? * MON"
        timezone_id: "UTC"
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ./dist/*.whl
              - databricks-feature-engineering
      tasks:
        - task_key: recalibrate_champion
          environment_key: default
          python_wheel_task:
            package_name: grid_carbon_intensity_mlops
            entry_point: carbon-recalibrate
        - task_key: spark_udf_batch_score
          depends_on:
            - task_key: recalibrate_champion
          environment_key: default
          python_wheel_task:
            package_name: grid_carbon_intensity_mlops
            entry_point: carbon-score
            parameters: ["--mode", "databricks"]
        - task_key: compute_monitoring
          depends_on:
            - task_key: recalibrate_champion
          environment_key: default
          python_wheel_task:
            package_name: grid_carbon_intensity_mlops
            entry_point: carbon-monitor
        - task_key: dashboard_extracts
          depends_on:
            - task_key: recalibrate_champion
          environment_key: default
          python_wheel_task:
            package_name: grid_carbon_intensity_mlops
            entry_point: carbon-extracts

    # Run after the inference job: the agent answers its evaluation questions from the Gold
    # tables that job wrote, and the task fails if any answer is wrong or ungrounded.
    # The second task asks the same questions with a hosted language model choosing the tool.
    # It calls that model once per question, under the job's own identity (no stored token).
    carbon_qa_agent_check:
      name: "[${bundle.target}] carbon-qa-agent-check"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ./dist/*.whl
              - databricks-feature-engineering
              - openai>=1.45.0
      tasks:
        - task_key: qa_agent_check
          environment_key: default
          python_wheel_task:
            package_name: grid_carbon_intensity_mlops
            entry_point: carbon-agent-check
        - task_key: qa_agent_check_llm
          depends_on:
            - task_key: qa_agent_check
          environment_key: default
          python_wheel_task:
            package_name: grid_carbon_intensity_mlops
            entry_point: carbon-agent-check-llm
