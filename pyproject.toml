[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grid-carbon-intensity-mlops"
version = "0.1.0"
description = "24-Hour Probabilistic Grid Carbon Intensity Forecasting & MLOps Pipeline (DE-LU & FR)"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.3.0",
    "mlflow>=2.16.0",
    "matplotlib>=3.9.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]
agent = [
    "openai>=1.45.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carbon_mlops"]

# A Databricks job has no repository checkout: ship the pinned Bronze snapshot in the wheel,
# beside the code package so that model artifacts (which copy the code) stay small.
[tool.hatch.build.targets.wheel.force-include]
"data/bronze_snapshot/entsoe_generation_sample.parquet" = "carbon_mlops_data/entsoe_generation_sample.parquet"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[project.scripts]
carbon-ingest = "carbon_mlops.jobs:ingest_main"
carbon-features = "carbon_mlops.jobs:features_main"
carbon-train = "carbon_mlops.jobs:train_main"
carbon-gate = "carbon_mlops.jobs:gate_main"
carbon-recalibrate = "carbon_mlops.jobs:recalibrate_main"
carbon-score = "carbon_mlops.jobs:score_main"